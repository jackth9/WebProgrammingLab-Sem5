<!DOCTYPE html>
<html>
<head>
    <title>Cookie Form</title>
</head>
<body>
    <h2>Enter User Details</h2>
    <form action="SetCookieServlet" method="POST">
        <label for="personName">Person Name:</label><br>
        <input type="text" id="personName" name="personName" required><br><br>
        
        <label for="secretCode">Secret Code:</label><br>
        <input type="password" id="secretCode" name="secretCode" required><br><br>
        
        <input type="submit" value="Save Cookies">
    </form>
</body>
</html>
