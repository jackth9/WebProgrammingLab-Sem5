<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .calculator-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 450px;
            padding: 35px 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h2 {
            color: #11998e;
            font-size: 26px;
            margin-bottom: 8px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            border-color: #11998e;
            box-shadow: 0 0 0 3px rgba(17, 153, 142, 0.15);
        }
        .btn {
            width: 100%;
            padding: 13px;
            background: #11998e;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            background: #0e8076;
        }
    </style>
</head>
<body>
    <div class="calculator-card">
        <div class="header">
            <h2>Simple Interest Calculator</h2>
            <p>Client-Server JSP & JavaBean Demo</p>
        </div>
        <form action="calculateInterest.jsp" method="POST">
            <div class="form-group">
                <label for="p">Principal Amount (P):</label>
                <input type="number" id="p" name="p" step="any" min="0" placeholder="e.g. 10000" required>
            </div>

            <div class="form-group">
                <label for="n">Number of Years (N):</label>
                <input type="number" id="n" name="n" step="any" min="0" placeholder="e.g. 2.5" required>
            </div>

            <div class="form-group">
                <label for="r">Rate of Interest per Annum % (R):</label>
                <input type="number" id="r" name="r" step="any" min="0" placeholder="e.g. 7.5" required>
            </div>

            <button type="submit" class="btn">Calculate Simple Interest</button>
        </form>
    </div>
</body>
</html>
